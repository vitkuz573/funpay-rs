[package]
name = "funpay-rs"
version = "0.1.0"
edition = "2021"
description = "Unofficial Rust SDK for FunPay.com — P2P gaming marketplace"
license = "MIT"
repository = "https://github.com/vitkuz573/funpay-rs"
authors = ["Vitaly Kuzyaev <vitkuz573@gmail.com>"]
keywords = ["funpay", "gaming", "marketplace", "scraper"]
categories = ["web-programming", "parser-implementations"]
readme = "README.md"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }

[dependencies]
reqwest = { version = "0.12", features = ["json", "cookies"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
thiserror = "2"
log = "0.4"
async-stream = "0.3"
futures = "0.3"
