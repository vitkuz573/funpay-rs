[package]
name = "funpay-rs"
version = "0.1.0"
edition = "2021"
description = "Unofficial Rust SDK for FunPay.com — P2P gaming marketplace"
license = "MIT"
repository = "https://github.com/vitkuz573/funpay-rs"
authors = ["Vitaly Kuzyaev <vitkuz573@gmail.com>"]
keywords = ["funpay", "gaming", "marketplace", "scraper"]
categories = ["web-programming", "parser-implementations"]
readme = "README.md"

[features]
default = ["streaming"]
streaming = ["dep:async-stream", "dep:futures"]
export = ["dep:csv"]
ws = ["dep:tokio-tungstenite", "dep:futures-util"]
full = ["streaming", "export", "ws"]

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }
criterion = { version = "0.5", features = ["html_reports"] }
rust_decimal_macros = "1"

[[bench]]
name = "parser_bench"
harness = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2", features = ["serde"] }
thiserror = "2"
log = "0.4"
rust_decimal = { version = "1", features = ["serde-with-str"] }
lru = "0.12"
rand = "0.8"
async-stream = { version = "0.3", optional = true }
futures = { version = "0.3", optional = true }
csv = { version = "1", optional = true }
tokio-tungstenite = { version = "0.24", features = ["native-tls"], optional = true }
futures-util = { version = "0.3", optional = true }
